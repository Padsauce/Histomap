# Construit l'application et la publie sur GitHub Pages à chaque push sur la branche principale
# et chaque semaine (index mondial rafraîchi).
# Prérequis (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Déploiement GitHub Pages

on:
  push:
    branches: ["claude/cultural-education-app-224852", "main"]
  workflow_dispatch:
  # Reconstruction hebdomadaire de l'index mondial (lundi 04:17 UTC)
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Index mondial : reconstruit depuis Wikidata ; en cas d'échec, l'index du dépôt est conservé
      - run: npm run build:index
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
