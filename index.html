<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histomap</title>
  <meta name="description" content="Explorer l'histoire sur une carte du monde, au fil du temps.">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-toggle-left" class="ghost icon-btn" data-i18n-aria="app.menu">☰</button>
    <div class="brand">
      <span class="logo" aria-hidden="true">◐</span>
      <h1 data-i18n="app.title">Histomap</h1>
    </div>
    <label class="scenario-picker">
      <select id="scenario-select" data-i18n-aria="app.chooseSubject"></select>
    </label>
  </header>

  <main class="layout">
    <!-- Panneau gauche : sujet / chronologie (vue liste) -->
    <aside id="left-panel" class="panel left">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-subject" aria-selected="true" aria-controls="pane-subject" data-i18n="tab.subject">Sujet</button>
        <button role="tab" id="tab-chrono" aria-selected="false" aria-controls="pane-chrono" data-i18n="tab.chronology">Chronologie</button>
      </div>

      <div id="pane-subject" role="tabpanel" aria-labelledby="tab-subject" class="pane">
        <section class="scenario-intro">
          <h2 id="scenario-title"></h2>
          <p id="scenario-subtitle" class="muted"></p>
          <p id="scenario-desc"></p>
        </section>

        <section>
          <h3 data-i18n="legend.title">Légende</h3>
          <ul id="legend" class="legend"></ul>
        </section>

        <section>
          <h3 data-i18n="display.title">Affichage</h3>
          <label class="toggle"><input type="checkbox" id="opt-trail"> <span data-i18n="display.trail"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-labels" checked> <span data-i18n="display.labels"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-modern"> <span data-i18n="display.modern"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-globe" checked> <span data-i18n="display.globe"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-cvd"> <span data-i18n="display.cvd"></span></label>
          <label class="field"><span data-i18n="display.basemap"></span>
            <select id="opt-basemap">
              <option value="voyager" data-i18n="display.basemap.voyager"></option>
              <option value="satellite" data-i18n="display.basemap.satellite"></option>
            </select>
          </label>
          <label class="field"><span data-i18n="display.lang"></span>
            <select id="opt-lang"></select>
          </label>
        </section>

        <section id="sources" class="sources muted small"></section>
      </div>

      <div id="pane-chrono" role="tabpanel" aria-labelledby="tab-chrono" class="pane" hidden>
        <p id="chrono-count" class="muted small"></p>
        <ol id="chrono-list" class="chrono-list"></ol>
      </div>
    </aside>

    <!-- Carte -->
    <section class="map-wrap">
      <div id="map"></div>
      <div id="filters" class="filters" role="toolbar" data-i18n-aria="filters.label"></div>
      <div class="map-notes">
        <div id="snapshot-badge" class="badge" data-i18n-title="map.bordersHint"></div>
        <div id="hidden-note" class="badge subtle" hidden></div>
      </div>
      <div id="loading" class="loading" hidden></div>
      <div id="offline" class="loading warn" hidden data-i18n="map.offline"></div>
    </section>

    <!-- Inspecteur -->
    <aside id="inspector" class="panel right">
      <div class="inspector-head">
        <h3 data-i18n="inspector.title">Inspecteur</h3>
        <button id="btn-close-inspector" class="ghost icon-btn" data-i18n-aria="inspector.close">✕</button>
      </div>
      <div id="inspector-body" class="inspector-body"></div>
    </aside>
  </main>

  <!-- Frise -->
  <footer class="timeline">
    <div class="timeline-controls">
      <button id="btn-prev" class="ghost icon-btn" data-i18n-aria="time.stepBack">◀</button>
      <button id="btn-play" class="primary icon-btn" data-i18n-aria="time.play">▶</button>
      <button id="btn-next" class="ghost icon-btn" data-i18n-aria="time.stepForward">▶︎|</button>
      <select id="speed" data-i18n-aria="time.speed">
        <option value="40" data-i18n="time.speed.slow"></option>
        <option value="20" data-i18n="time.speed.normal" selected></option>
        <option value="8" data-i18n="time.speed.fast"></option>
      </select>
      <div class="date-display">
        <div id="date-label" class="date-label" aria-live="polite"></div>
        <div id="scale-label" class="muted small"></div>
      </div>
      <div class="zoom-controls">
        <button id="btn-tzoom-out" class="ghost icon-btn" data-i18n-aria="time.zoomOut" data-i18n-title="time.zoomOut">−</button>
        <button id="btn-tzoom-in" class="ghost icon-btn" data-i18n-aria="time.zoomIn" data-i18n-title="time.zoomIn">+</button>
        <button id="btn-tfit" class="ghost icon-btn" data-i18n-aria="time.fit" data-i18n-title="time.fit">⤢</button>
      </div>
    </div>
    <div id="timeline" class="timeline-canvas-wrap" data-i18n-title="time.hint"></div>
  </footer>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="i18n/fr.js"></script>
  <script src="i18n/en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="data/categories.js"></script>
  <script src="data/entities.js"></script>
  <script src="data/scenarios.js"></script>
  <script src="js/time.js"></script>
  <script src="js/net.js"></script>
  <script src="js/wiki.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
