<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histomap</title>
  <meta name="description" content="Explorer l'histoire sur une carte du monde, au fil du temps, à partir de Wikidata et Wikipédia.">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563eb'/%3E%3Cpath d='M16 2a14 14 0 0 0 0 28z' fill='%2393c5fd'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <button id="btn-toggle-left" class="ghost icon-btn" data-i18n-aria="app.menu">☰</button>
    <div class="brand">
      <span class="logo" aria-hidden="true">◐</span>
      <h1 data-i18n="app.title">Histomap</h1>
    </div>
    <div class="search" role="search">
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list"
             data-i18n-aria="search.label">
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </div>
    <button id="btn-prep" class="ghost prep-toggle" aria-pressed="false" data-i18n-title="prep.toggleHint"><span aria-hidden="true">🎒</span> <span data-i18n="prep.toggle"></span></button>
    <label class="scenario-picker">
      <select id="scenario-select" data-i18n-aria="app.chooseSubject"></select>
    </label>
  </header>

  <main class="layout">
    <!-- Panneau gauche : sujet / chronologie (vue liste) -->
    <aside id="left-panel" class="panel left">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-subject" aria-selected="true" aria-controls="pane-subject" data-i18n="tab.subject">Sujet</button>
        <button role="tab" id="tab-chrono" aria-selected="false" aria-controls="pane-chrono" data-i18n="tab.chronology">Chronologie</button>
        <button role="tab" id="tab-prep" aria-selected="false" aria-controls="pane-prep" data-i18n="tab.prep">Préparer</button>
      </div>

      <div id="pane-subject" role="tabpanel" aria-labelledby="tab-subject" class="pane">
        <section class="scenario-intro">
          <h2 id="scenario-title"></h2>
          <p id="scenario-subtitle" class="muted"></p>
          <p id="scenario-desc"></p>
          <ul id="scenario-notes" class="notes"></ul>
          <p id="scenario-source" class="small"></p>
        </section>

        <section>
          <h3 data-i18n="legend.title">Légende</h3>
          <ul id="legend" class="legend"></ul>
        </section>

        <section>
          <h3 data-i18n="display.title">Affichage</h3>
          <label class="toggle"><input type="checkbox" id="opt-trail"> <span data-i18n="display.trail"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-labels" checked> <span data-i18n="display.labels"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-modern"> <span data-i18n="display.modern"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-globe" checked> <span data-i18n="display.globe"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-cvd"> <span data-i18n="display.cvd"></span></label>
          <label class="toggle"><input type="checkbox" id="opt-dynamic" checked> <span data-i18n="display.dynamic"></span></label>
          <div id="morph-progress" class="morph-progress" hidden role="status">
            <div class="bar"><span id="morph-progress-bar"></span></div>
            <span id="morph-progress-text" class="muted small"></span>
          </div>
          <label class="field"><span data-i18n="display.borders"></span>
            <select id="opt-borders">
              <option value="fast" data-i18n="display.borders.fast"></option>
              <option value="precise" data-i18n="display.borders.precise"></option>
            </select>
          </label>
          <label class="field"><span data-i18n="import.label"></span>
            <input type="file" id="opt-import" accept=".geojson,.json,application/geo+json,application/json">
            <span id="user-status" class="muted small" data-i18n="import.hint"></span>
          </label>
          <label class="field"><span data-i18n="display.basemap"></span>
            <select id="opt-basemap">
              <option value="voyager" data-i18n="display.basemap.voyager"></option>
              <option value="satellite" data-i18n="display.basemap.satellite"></option>
            </select>
          </label>
          <label class="field"><span data-i18n="display.lang"></span>
            <select id="opt-lang"></select>
          </label>
        </section>

        <section id="sources" class="sources muted small"></section>
      </div>

      <div id="pane-prep" role="tabpanel" aria-labelledby="tab-prep" class="pane" hidden>
        <p class="muted small" data-i18n="prep.intro"></p>
        <label class="field"><span data-i18n="prep.title"></span><input id="prep-title" type="text"></label>
        <div class="actions">
          <button id="btn-prep-view" class="prep-only" data-i18n="prep.addView"></button>
          <button id="btn-prep-note" class="prep-only" data-i18n="prep.addNote"></button>
        </div>
        <p id="prep-count" class="muted small"></p>
        <ol id="prep-items" class="prep-items"></ol>
        <ul id="prep-notes" class="prep-notes"></ul>
        <label class="toggle small"><input type="checkbox" id="prep-morphs" checked> <span data-i18n="prep.includeMorphs"></span></label>
        <div class="actions prep-actions">
          <button id="btn-tour" class="primary" data-i18n="prep.tour"></button>
          <button id="btn-download" data-i18n="prep.download"></button>
          <button id="btn-print" data-i18n="prep.sheet"></button>
        </div>
        <section>
          <h3 data-i18n="prep.openTitle"></h3>
          <label class="field"><span class="muted small" data-i18n="prep.openHint"></span><input id="open-pkg" type="file" accept=".histomap,.json,application/gzip,application/json"></label>
          <button id="btn-tour-pkg" class="primary" hidden data-i18n="prep.tourPkg"></button>
        </section>
        <p id="prep-status" class="muted small" role="status"></p>
      </div>

      <div id="pane-chrono" role="tabpanel" aria-labelledby="tab-chrono" class="pane" hidden>
        <p id="chrono-count" class="muted small"></p>
        <ol id="chrono-list" class="chrono-list"></ol>
      </div>
    </aside>

    <!-- Carte -->
    <section class="map-wrap">
      <div id="map"></div>
      <div id="filters" class="filters" role="toolbar" data-i18n-aria="filters.label"></div>
      <div class="map-notes">
        <div id="snapshot-badge" class="badge" data-i18n-title="map.bordersHint"></div>
        <div id="hidden-note" class="badge subtle" hidden></div>
      </div>
      <div id="loading" class="loading" hidden></div>
      <div id="offline" class="loading warn" hidden data-i18n="map.offline"></div>
      <div id="generating" class="generating" role="status" aria-live="polite" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <strong id="generating-title"></strong>
          <div id="generating-step" class="muted small"></div>
        </div>
        <button id="generating-cancel" class="ghost small" data-i18n="search.cancel"></button>
      </div>
    </section>

    <!-- Inspecteur -->
    <aside id="inspector" class="panel right">
      <div class="inspector-head">
        <h3 data-i18n="inspector.title">Inspecteur</h3>
        <button id="btn-close-inspector" class="ghost icon-btn" data-i18n-aria="inspector.close">✕</button>
      </div>
      <div id="inspector-body" class="inspector-body"></div>
    </aside>
  </main>

  <!-- Visite guidée (mode présentation) -->
  <div id="tour" class="tour" hidden role="dialog" aria-live="polite">
    <div class="tour-head"><span id="tour-n" class="muted small"></span><span id="tour-date" class="muted small"></span>
      <button id="tour-close" class="ghost icon-btn" data-i18n-aria="tour.close">✕</button></div>
    <h2 id="tour-title"></h2>
    <p id="tour-note"></p>
    <div class="actions"><button id="tour-prev" data-i18n="tour.prev"></button><button id="tour-next" class="primary"></button></div>
  </div>

  <!-- Frise -->
  <footer class="timeline">
    <div class="timeline-controls">
      <button id="btn-prev" class="ghost icon-btn" data-i18n-aria="time.stepBack">◀</button>
      <button id="btn-play" class="primary icon-btn" data-i18n-aria="time.play">▶</button>
      <button id="btn-next" class="ghost icon-btn" data-i18n-aria="time.stepForward">▶︎|</button>
      <select id="speed" data-i18n-aria="time.speed">
        <option value="40" data-i18n="time.speed.slow"></option>
        <option value="20" data-i18n="time.speed.normal" selected></option>
        <option value="8" data-i18n="time.speed.fast"></option>
      </select>
      <div class="date-display">
        <div id="date-label" class="date-label" aria-live="polite"></div>
        <div id="scale-label" class="muted small"></div>
      </div>
      <div class="zoom-controls">
        <button id="btn-tzoom-out" class="ghost icon-btn" data-i18n-aria="time.zoomOut" data-i18n-title="time.zoomOut">−</button>
        <button id="btn-tzoom-in" class="ghost icon-btn" data-i18n-aria="time.zoomIn" data-i18n-title="time.zoomIn">+</button>
        <button id="btn-tfit" class="ghost icon-btn" data-i18n-aria="time.fit" data-i18n-title="time.fit">⤢</button>
        <button id="btn-lanes" class="ghost icon-btn" aria-pressed="false" data-i18n-aria="world.lanes" data-i18n-title="world.lanes">☷</button>
      </div>
    </div>
    <div id="timeline" class="timeline-canvas-wrap" data-i18n-title="time.hint"></div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
